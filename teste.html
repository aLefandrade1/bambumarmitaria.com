<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faça seu pedido</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#111 var(--bg) center / cover no-repeat;
    min-height:100dvh;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:24px 20px;
  }
  .links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    min-height:60px;padding:12px 22px;
    border-radius:999px;text-decoration:none;
    font-weight:800;font-size:1.05rem;color:var(--txt,#fff);
    background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 100%);
    border:2px solid var(--borda);
    box-shadow:0 0 10px rgba(var(--glow),.8),0 0 22px rgba(var(--glow),.45),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .15s,box-shadow .15s;
  }
  .btn:hover{box-shadow:0 0 14px rgba(var(--glow),1),0 0 30px rgba(var(--glow),.65),inset 0 1px 0 rgba(255,255,255,.45)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  :root{--bg:var(--bg-cel,none)}
  @media (min-width:900px) and (orientation:landscape){:root{--bg:var(--bg-pc,var(--bg-cel,none))}}
  .btn img{width:36px;height:36px;border-radius:50%;object-fit:contain;flex:none}
</style>
</head>
<body>

<nav class="links" id="links" aria-label="Formas de pedir"></nav>

<script>
/* ============ EDITE AQUI ============ */

// Imagem de fundo do CELULAR (1080 x 1920, vertical)
const FUNDO_CELULAR = "https://i.postimg.cc/ZRJSZ660/Copia-de-Cardapio-do-dia-restaurante-moderno-preto-e-amarelo.png";

// Imagem de fundo do COMPUTADOR (1920 x 1080, horizontal)
const FUNDO_PC = "COLE-AQUI-O-LINK-DA-IMAGEM-DO-COMPUTADOR";

// Botões: texto, link de destino, link do ícone e cores
const BOTOES = [
  { texto: "Pedir no WhatsApp", link: "https://wa.me/5567999999999",          icone: "COLE-AQUI-O-LINK-DO-ICONE-WHATSAPP",
    c1: "#2fd66b", c2: "#12a84a", borda: "#b9ffd0", glow: "80,255,140",  txt: "#fff" },
  { texto: "Pedir no Anota Aí", link: "https://COLE-AQUI-O-LINK-DO-ANOTA-AI", icone: "COLE-AQUI-O-LINK-DO-ICONE-ANOTA-AI",
    c1: "#7fd0ff", c2: "#3aa3ea", borda: "#dcf2ff", glow: "100,195,255", txt: "#fff" },
  { texto: "Pedir no iFood",    link: "https://COLE-AQUI-O-LINK-DO-IFOOD",    icone: "COLE-AQUI-O-LINK-DO-ICONE-IFOOD",
    c1: "#ff4a57", c2: "#d81424", borda: "#ffc9cd", glow: "255,80,90",   txt: "#fff" },
  { texto: "Pedir na 99",       link: "https://COLE-AQUI-O-LINK-DA-99",       icone: "COLE-AQUI-O-LINK-DO-ICONE-99",
    c1: "#ffdc45", c2: "#f7b900", borda: "#fff2b0", glow: "255,210,60",  txt: "#1c1b1a" }
];

/* ============ NÃO PRECISA MEXER ABAIXO ============ */
const root = document.documentElement.style;
const cel = FUNDO_CELULAR.startsWith("http") ? FUNDO_CELULAR : "";
const pc  = FUNDO_PC.startsWith("http") ? FUNDO_PC : cel;
if (cel) root.setProperty("--bg-cel", `url("${cel}")`);
if (pc)  root.setProperty("--bg-pc",  `url("${pc}")`);

const nav = document.getElementById("links");
BOTOES.forEach(b => {
  const a = document.createElement("a");
  a.className = "btn";
  a.href = b.link;
  a.target = "_blank";
  a.rel = "noopener";
  a.style.setProperty("--c1", b.c1);
  a.style.setProperty("--c2", b.c2);
  a.style.setProperty("--borda", b.borda);
  a.style.setProperty("--glow", b.glow);
  a.style.setProperty("--txt", b.txt);

  if (b.icone.startsWith("http")) {
    const img = document.createElement("img");
    img.src = b.icone; img.alt = "";
    img.onerror = () => img.remove();
    a.appendChild(img);
  }

  const s = document.createElement("span");
  s.textContent = b.texto;
  a.appendChild(s);
  nav.appendChild(a);
});
</script>
</body>
</html>
